<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodSoft Tasks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            color: #60a5fa;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 40px;
        }

        .tasks {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .task {
            background: #1e293b;
            padding: 30px;
            width: 250px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .task h2 {
            margin-bottom: 15px;
        }

        .task a {
            display: inline-block;
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .task a:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <h1>CODSOFT Internship Tasks</h1>
    <p>Select a task to view the project</p>

    <div class="tasks">

        <div class="task">
            <h2>Task 1</h2>
            <p>Personal Portfolio</p>
            <a href="./TASK-1-PORTFOLIO/">View Task</a>
        </div>

        <div class="task">
            <h2>Task 2</h2>
            <p>To-Do List</p>
            <a href="./TASK-2-TODO-LIST/">View Task</a>
        </div>

        <div class="task">
            <h2>Task 3</h2>
            <p>Expense Tracker</p>
            <a href="./TASK-3-EXPENSE-TRACKER/">View Task</a>
        </div>

    </div>

</body>
</html>
